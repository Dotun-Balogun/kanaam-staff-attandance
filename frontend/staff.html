<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12233f">
  <title>Staff · Staff Attendance</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="staff">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="main">
      <h2>Staff</h2>
      <p class="sub">Register a staff member, then they press their thumb on the scanner 5 times.</p>
      <section class="card">
        <div class="row">
          <div class="field"><label for="no">Staff number</label><input id="no" autocomplete="off" placeholder="e.g. KNM/001"></div>
          <div class="field"><label for="name">Full name</label><input id="name" autocomplete="off"></div>
          <div class="field"><label for="dept">Department</label><select id="dept"></select></div>
          <div class="field"><label for="desig">Designation</label><input id="desig" autocomplete="off" placeholder="e.g. Admin Officer"></div>
          <button class="btn" id="reg">Register thumb</button>
        </div>
        <p class="msg" id="reg-msg" role="status"></p>
      </section>
      <section class="card"><h3>Registered staff</h3><div id="list"></div></section>
    </main>
  </div>
  <script type="module" src="js/pages/staff.js"></script>
</body>
</html>
