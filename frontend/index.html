<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12233f">
  <title>Clock in / out · Staff Attendance</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/clock.css">
</head>
<body data-page="clock">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="main">
      <h2>Clock in / out</h2>
      <p class="sub">Staff place a thumb on the scanner. The first scan of the day clocks in, the next one clocks out.</p>
      <section class="card clock-display"><div class="time" id="time"></div><div class="date" id="date"></div></section>
      <section class="card">
        <div class="pad wait" id="pad">
          <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 11a7 7 0 0 1 14 0v3"/><path d="M8 20c1-2 1-4 1-6a3 3 0 0 1 6 0c0 3 .3 5 1 7"/><path d="M12 12v3c0 2 .3 3.5 1 5"/><path d="M3 15c0-2 0-3 .5-4.5M21 14.5c0 1.5 .2 2.6.5 3.5"/></svg></div>
          <strong id="pad-text">Place your thumb on the scanner</strong>
          <div id="result" aria-live="polite"></div>
        </div>
        <div class="center"><button class="btn ghost" id="toggle">Pause terminal</button></div>
      </section>
    </main>
  </div>
  <script type="module" src="js/pages/clock.js"></script>
</body>
</html>
